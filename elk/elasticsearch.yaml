services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.6.2
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms3g -Xmx3g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - elk
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data  # <== Добавлено хранилище данных

  kibana:
    image: docker.elastic.co/kibana/kibana:8.6.2
    restart: always
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=true
      - SERVER_PUBLICBASEURL=${PUBLIC_BASE_URL}/kibana
    ports:
      - "5601:5601"
    networks:
      - elk
    volumes:
      - kibana-data:/usr/share/kibana/data  # <== Добавлено хранилище Kibana

  grafana:
    image: grafana/grafana:latest
    restart: always
    depends_on:
      - elasticsearch
    ports:
      - "3000:3000"
    environment:
     - GF_SECURITY_ADMIN_USER=admin
     - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
     - GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app
     - GF_SERVER_ROOT_URL=${PUBLIC_BASE_URL}/grafana/
     - GF_SERVER_SERVE_FROM_SUB_PATH=true


    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - elk

networks:
  elk:
    driver: bridge

volumes:
  elasticsearch-data:  # <== Определение volume
  kibana-data:         # <== Определение volume
  grafana-data:
